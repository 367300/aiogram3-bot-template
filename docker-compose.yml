services:
  aiogram-bot:
    build: .
    container_name: aiogram-bot
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OVPN_CONFIG_PATH=/app/vpn.ovpn
    volumes:
      - ./data:/app/data
      - ./vpn_config:/app/vpn_config:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["python", "main.py"]