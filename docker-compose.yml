services:
  aiogram-bot:
    build: .
    container_name: aiogram-bot
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
    volumes:
      - ./data:/app/data
    command: ["./init_certificates.sh"]